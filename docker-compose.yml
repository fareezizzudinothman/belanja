name: belanja

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /opt/webstack/secrets/belanja.env
    environment:
      NODE_ENV: production
      PORT: 4000
      POSTGRES_SCHEMA: belanja
      RUN_MIGRATIONS: "true"
    networks:
      homelab-network:
        aliases:
          - belanja-backend
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  homelab-network:
    external: true